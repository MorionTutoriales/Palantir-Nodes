name: Release

# Al subir una etiqueta "v*" (p. ej. v0.2.0) se prueba el código, se construye la versión
# descargable de Windows y se publica en la sección Releases de GitHub.
# También se puede lanzar a mano ("Run workflow") para probar la construcción: en ese caso el
# .zip queda como artefacto de la ejecución y no se publica nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # necesario para crear la release y subir los archivos

jobs:
  test:
    name: Pruebas
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools packaging
      - run: python -m pytest -q

  build:
    name: Construir y publicar (Windows)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar (con los nodos WebSocket y PyInstaller)
        run: python -m pip install -e ".[network]" pyinstaller

      - name: Comprobar que la etiqueta coincide con la versión del proyecto
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/build_release.py --check-tag "${{ github.ref_name }}"

      - name: Notas de la release (desde CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release_notes.py --tag "${{ github.ref_name }}" --out release-notes.md

      - name: Construir y comprobar el ejecutable
        run: python tools/build_release.py

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: palantir-nodes-windows
          path: dist-release/*
          if-no-files-found: error

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
