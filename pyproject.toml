[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "palantir-nodes"
version = "0.1.0"
description = "Editor visual de nodos para Python y OpenCV, inspirado en el Shader Editor de Blender"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "opencv-python>=4.10",
    "numpy>=2.0",
]

[project.optional-dependencies]
mediapipe = [
    "mediapipe",
]
network = [
    "websockets>=13",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "websockets>=13",
]

[project.gui-scripts]
palantir-nodes = "palantir_nodes.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Mensajes de diagnóstico largos para el usuario.
"src/palantir_nodes/customnodes/analysis.py" = ["E501"]
"src/palantir_nodes/customnodes/library.py" = ["E501"]
"src/palantir_nodes/ui/custom_nodes_dialog.py" = ["E501"]
"tests/test_custom_nodes.py" = ["E501"]
"tests/test_custom_nodes_ui.py" = ["E501"]
"tests/test_libraries.py" = ["E501"]
"tests/test_compile.py" = ["E501"]
"tests/test_import_paths.py" = ["E501"]
"tests/test_libraries_tcp_mediapipe.py" = ["E501"]
"tests/test_conversions.py" = ["E501"]
